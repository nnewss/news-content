name: Purge jsDelivr cache for index.json
on:
  push:
    branches:
      - main
    paths:
      - 'index.json' # Скрипт будет срабатывать только при изменении этого файла

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge index.json cache
        run: |
          curl -L -X POST \
            https://purge.jsdelivr.net \
            -H 'cache-control: no-cache' \
            -H 'content-type: application/json' \
            -d '{"path":["/gh/nnewss/news-content@main/index.json"]}'
